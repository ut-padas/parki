name: CPU Testing - linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash -el {0}

jobs:
  test_cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          conda-remove-defaults: true
      - name: install
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04-arm" ]]; then
            export CMAKE_BUILD_PARALLEL_LEVEL=1
            export PYKOKKOS_UNITY_BATCH_SIZE=1
          fi
          ENABLE_OPENMP=OFF PYTHON_VERSION=${{ matrix.python-version }} bash install.sh
      - name: test
        run: |
          conda activate parki
          if [[ "${{ matrix.os }}" == "ubuntu-22.04-arm" ]]; then
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          python -c 'import pykokkos; from scipy.fft import rfftn'
          python -m pytest tests --ignore=tests/test_distributed_ewald.py
