[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs >= 0.4"]
build-backend = "hatchling.build"

[project]
name = "parkipy"
dynamic = ["version"]
description = "Performance portable fast Ewald summation"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
	"Environment :: GPU",
	"Environment :: GPU :: NVIDIA CUDA",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
]
licence = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
authors = [
	{name = "Gabriel Kosmacher"},
	{name = "Ziyu Du"},
	{name = "Joar Bagge"},
	{name = "George Biros"},
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.0",
    "black==26.10.1",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)$'

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
